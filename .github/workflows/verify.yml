name: SOCRA AI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  backend-verification:
    name: Backend Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile Python source
        working-directory: backend
        run: python -m compileall app main.py

      - name: Run backend tests
        working-directory: backend
        run: |
          python test_analytics.py
          python test_event_registry.py
          python test_existing_registry_compatibility.py
          python test_mitre_multitechnique.py
          python test_event_normalization.py
          python test_persistence.py

  frontend-verification:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build